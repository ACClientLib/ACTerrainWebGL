<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>AC World Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        background-color: #242424;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        opacity: 0;
      }

      #loader {
        position: absolute;
        top: calc(50vh - 40px);
        left: calc(50vw - 40px);
        opacity: 1;
      }

      .lds-grid,
      .lds-grid div {
        box-sizing: border-box;
      }

      .lds-grid {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
        color: #1c4c5b;
      }

      .lds-grid div {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: currentColor;
        animation: lds-grid 1.2s linear infinite;
      }

      .lds-grid div:nth-child(1) { top: 8px; left: 8px; animation-delay: 0s; }
      .lds-grid div:nth-child(2) { top: 8px; left: 32px; animation-delay: -0.4s; }
      .lds-grid div:nth-child(3) { top: 8px; left: 56px; animation-delay: -0.8s; }
      .lds-grid div:nth-child(4) { top: 32px; left: 8px; animation-delay: -0.4s; }
      .lds-grid div:nth-child(5) { top: 32px; left: 32px; animation-delay: -0.8s; }
      .lds-grid div:nth-child(6) { top: 32px; left: 56px; animation-delay: -1.2s; }
      .lds-grid div:nth-child(7) { top: 56px; left: 8px; animation-delay: -0.8s; }
      .lds-grid div:nth-child(8) { top: 56px; left: 32px; animation-delay: -1.2s; }
      .lds-grid div:nth-child(9) { top: 56px; left: 56px; animation-delay: -1.6s; }

      .loaded canvas {
        animation: fadeInAnimation ease 0.5s;
        animation-iteration-count: 1;
        animation-fill-mode: forwards;
      }

      .loaded #loader {
        animation: fadeOutAnimation ease 0.25s;
        animation-iteration-count: 1;
        animation-fill-mode: forwards;
      }

      @keyframes fadeOutAnimation {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes fadeInAnimation {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes lds-grid {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="labels-overlay" aria-hidden="true"></div>
    <div id="mobile-controls" aria-label="Touch camera controls">
      <div class="mobile-joystick" id="movement-joystick" role="application" aria-label="Move">
        <div class="mobile-joystick-ring" aria-hidden="true"></div>
        <div class="mobile-joystick-knob" aria-hidden="true"></div>
      </div>
      <div class="mobile-joystick" id="look-joystick" role="application" aria-label="Look around">
        <div class="mobile-joystick-ring" aria-hidden="true"></div>
        <div class="mobile-joystick-knob" aria-hidden="true"></div>
      </div>
    </div>
    <div id="loader">
      <div class="lds-grid">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
    <div id="dos-overlay" aria-live="polite">
      <div><span id="monitor-coordinates">--</span></div>
      <div>FPS <span id="monitor-fps">--</span></div>
      <div id="loading-spinner" role="status" aria-label="Loading details" aria-describedby="loading-details" tabindex="0">
        <span class="loading-spinner-icon" aria-hidden="true"></span>
        <span class="loading-spinner-label">Loading</span>
        <div id="loading-details" role="tooltip"></div>
      </div>
    </div>
    <div id="camera-hint" aria-hidden="true">Press 'C' to switch cameras</div>
    <aside id="sidebar" aria-label="Viewer settings">
      <div class="sidebar-header">
        <span>Viewer</span>
        <button id="sidebar-close" type="button" aria-label="Close settings">×</button>
      </div>
      <div class="sidebar-content">
        <section class="sidebar-section sidebar-section-persistent">
          <h2>Server / DAT</h2>
          <label class="control-row">
            <span>World</span>
            <select id="dataset-selector" aria-label="World dataset"></select>
          </label>
        </section>
        <section class="sidebar-section sidebar-section-persistent">
          <h2>Locations</h2>
          <div id="locations-content" class="sidebar-section-content"></div>
        </section>
        <section class="sidebar-section" id="config-section">
          <button class="sidebar-section-toggle" type="button" aria-expanded="false" aria-controls="config-content"><span>Settings</span><span aria-hidden="true">⌄</span></button>
          <div id="config-content" class="sidebar-section-content collapsed"></div>
        </section>
        <section class="sidebar-section" id="sidebar-actions-section">
          <div id="sidebar-actions-content"></div>
        </section>
      </div>
    </aside>
    <button id="camera-toggle" type="button" aria-label="Switch camera" title="Switch camera"><span aria-hidden="true">⇄</span></button>
    <button id="settings-toggle" type="button" aria-label="Open settings" aria-expanded="false"><span aria-hidden="true">⚙</span></button>
    <!-- Temporary iOS debugging. Remove after touch controls are working. -->
    <script>
      (() => {
        const showError = (message) => {
          //window.alert(`ACTerrainWebGL error:\n\n${message}`);
        };
        window.addEventListener("error", (event) => {
          showError(event.error?.stack || event.message || "Unknown error");
        });
        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          showError(reason?.stack || reason?.message || String(reason));
        });
        const originalConsoleError = console.error;
        console.error = (...args) => {
          originalConsoleError.apply(console, args);
          showError(args.map((arg) => String(arg)).join(" "));
        };
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
